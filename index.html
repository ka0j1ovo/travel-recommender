<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行城市推荐器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>旅行城市推荐器</h1>
  </header>

  <main>
    <aside class="sidebar">
      <section class="bento">
        <div class="bento-title">我想看到的景色</div>
        <div id="types"></div>
      </section>

      <section class="bento">
        <div class="bento-title">我的行程</div>
        <div id="trip"></div>
      </section>

      <section class="bento">
        <div class="bento-title">我的旅行喜好</div>
        <div id="prefs"></div>
      </section>

      <section class="bento">
        <div class="bento-title">我想征求建议</div>
        <div id="author"></div>
      </section>

      <button id="reset" class="reset">重置所有设置</button>
    </aside>

    <div class="right-col">
      <div class="map-col">
        <div id="china-map"></div>
      </div>

      <section class="results-panel">
        <div id="summary" class="summary"></div>
        <div id="jumpmode" class="jumpmode"></div>
        <div id="results" class="results"></div>
      </section>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="echarts.min.js"></script>
  <script src="china.js"></script>
  <script src="geo.js"></script>
  <script src="app.js"></script>
</body>
</html>
